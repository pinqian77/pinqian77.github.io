<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">AgenticVBench-Omni conceptual overview</title>
  <desc id="desc">Video, audio, images, and documents provide evidence for long-horizon agent work. Work outputs are scored by deterministic verifiers. This is a conceptual illustration based on the public ICLR 2027 submission abstract, not a figure from the paper.</desc>
